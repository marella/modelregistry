name: Publish

on:
  push:
    paths:
      - "models/*/*/*.torrent"
    branches:
      - main
    tags-ignore:
      - "**"
  workflow_dispatch:

jobs:
  create-torrent:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: pip install huggingface-hub==1.21.0 libtorrent==2.0.13

      - name: Publish
        run: |
          python scripts/track_torrents.py
          python scripts/publish.py

      - uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
        with:
          file_pattern: "_data/*.json"
          commit_message: "Auto Publish"
